function redeemCode(value){const code=value.trim().toUpperCase();if(!Object.prototype.hasOwnProperty.call(rewards,code))return {ok:false,message:'사용할 수 없는 코드입니다.'};if(redeemed.has(code))return {ok:false,message:'이미 적립한 코드입니다.'};redeemed.add(code);mileage+=rewards[code];return {ok:true,message:rewards[code]+'마일리지가 적립되었습니다.'};}

$('.code').onclick=()=>{if(ended)return notify('게임이 끝났어요');show('마일리지 적립','<p>획득한 코드를 입력하여 마일리지를 적립하세요.</p><form id="mileage-form"><label>코드<input id="mileage-code" autocomplete="off" autocapitalize="characters" spellcheck="false" required maxlength="40"></label><button>적립하기</button><p id="feedback" role="status"></p></form><p id="mileage-total" class="success"></p><p id="mileage-goal" class="success"></p>');updateMileage();$('#mileage-form').onsubmit=e=>{e.preventDefault();tick();if(ended)return;const result=redeemCode($('#mileage-code').value);$('#feedback').className=result.ok?'success':'error';$('#feedback').textContent=result.message;if(result.ok){$('#mileage-code').value='';notify(result.message+' 현재 마일리지는 총 '+mileage+' 입니다.');}updateMileage();render();if(result.ok&&mileage>=1500)finishMission('clear');};};

function finishMission(reason){if(missionShown)return;if(reason==='timeout'&&mileage<1500){running=false;ended=true;remaining=0;musicWanted=false;bgm.pause();followupSound=false;mileageSound.pause();campSound.pause();if($('#camp-popup').open)$('#camp-popup').close();$('#mission-screen').hidden=true;$('main').hidden=false;render();show('실패!','<p>제한 시간 안에 1500마일리지를 모으지 못했습니다.</p><p>현재 마일리지: '+mileage+' / 1500</p><button id="failure-retry">다시 시작</button>');$('#failure-retry').onclick=()=>{$('#modal').close();reset();};return;}missionShown=true;running=false;ended=true;if(reason==='timeout')remaining=0;musicWanted=false;bgm.pause();bgm.src=$('#mission-track').getAttribute('src');bgm.loop=true;bgm.currentTime=0;if($('#modal').open)$('#modal').close();$('main').hidden=true;$('#mission-screen').hidden=false;$('#mission-summary').textContent=(reason==='clear'?'1500마일리지 목표 달성!':'시간이 종료되었습니다.')+' 현재 마일리지는 총 '+mileage+' 입니다.';render();$('#mission-screen').focus();window.scrollTo(0,0);playMissionMusic();}

$('.code').onclick=()=>{if(ended)return openMileageBeforeRewards();openMileageBeforeRewards();const form=$('#mileage-form');const submitBeforeRewards=form.onsubmit;form.onsubmit=e=>{const code=$('#mileage-code').value.trim().toUpperCase();const before=mileage;submitBeforeRewards(e);if(mileage===before)return;const extra=code==='CAMP'||code==='FIRE';playMileageSound(extra);if(extra){$('#camp-title').textContent=code==='CAMP'?'내 텐트에 친구가 놀러왔어요!':'조리대가 개방되었습니다.';$('#camp-message').textContent=(code==='CAMP'?'32':'13')+'번 카드를 가져가세요.';$('#camp-mileage').textContent=rewards[code]+'마일리지가 적립되었습니다. 현재 마일리지는 총 '+mileage+' 입니다.';$('#camp-popup').showModal();}};};
