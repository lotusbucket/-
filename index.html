const $=s=>document.querySelector(s);const defaults={minutes:60,answer:'4312',penalty:60};let config={...defaults},remaining=3600000,deadline=0,running=false,ended=false,sound=false,automatic=false,hints=[],penalties=0,machine=false,elapsed=0,last=0,ctx,toastTimer;
const hintTexts=['쪽지의 기호를 숫자로 바꿔 보세요. 잎 → 사과 → 꽃 → 나비 순서입니다.','기계 장치의 다이얼을 3에 맞추면 기호별 숫자를 알 수 있어요.','잎 4, 사과 3, 꽃 1, 나비 2. 이 순서대로 네 자리 암호를 입력하세요.'];
function beep(freq=660){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.start();o.stop(ctx.currentTime+.3)}catch{}}

function show(t,html){$('#title').textContent=t;$('#body').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
$('#close').onclick=()=>$('#modal').close();
function render(){let s=Math.ceil(remaining/1000);$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('.play').classList.toggle('playing',running);$('.play').setAttribute('aria-label',running?'일시정지':'시작');$('#status').textContent=ended?(remaining<=0?'시간 종료 · 다시 도전해 보세요':'탈출 성공!'):(running?'탐험 중':elapsed?'일시정지':'시작 버튼을 눌러 주세요')+' · 벌점 '+penalties+'회';}
function tick(){if(running){let now=Date.now();elapsed+=Math.max(0,now-last);last=now;remaining=Math.max(0,deadline-now);if(!remaining){finishMission('timeout')}else if(automatic&&hints.length<3&&elapsed>=(hints.length+1)*300000)giveHint()}render()}
function toggle(){if(ended){notify('설정에서 새 게임을 시작해 주세요');return}if(running){tick();running=false}else{running=true;last=Date.now();deadline=last+remaining;beep()}render()}

const bgm=$('#bgm');let musicWanted=false;bgm.volume=.65;

$('.music').onclick=async()=>{musicWanted=!musicWanted;if(!musicWanted){bgm.pause();notify('배경음악 일시정지');return;}try{await bgm.play();if(musicWanted)notify('배경음악 재생 중');}catch(error){if(error.name==='AbortError')return;musicWanted=false;updateMusicButton();notify('음악을 재생하지 못했어요. 음표 버튼을 다시 눌러 주세요.');}};

$('.code').onclick=()=>{if(ended)return notify('게임이 끝났어요');show('암호 입력','<p>숲의 출구를 여는 암호를 입력하세요.</p><form id="unlock"><label>암호<input id="answer" autocomplete="off" required maxlength="40"></label><button>문 열기</button><p id="feedback" role="status" class="error"></p></form>');$('#unlock').onsubmit=e=>{e.preventDefault();tick();if(ended)return;if($('#answer').value.trim()===config.answer){running=false;ended=true;beep(880);render();show('탈출 성공!','<p>숲의 문이 열렸어요. 축하합니다!</p><p>남은 시간 <b>'+$('#timer').textContent+'</b> · 벌점 '+penalties+'회</p><button id="again">다시 플레이</button>');$('#again').onclick=()=>{reset();$('#modal').close()}}else{$('#feedback').textContent='암호가 달라요. 쪽지와 기계 장치를 확인해 주세요.';beep(220)}}};
$('.penalty').onclick=()=>{if(ended)return notify('게임이 끝났어요');show('벌점 적용','<p>남은 시간에서 '+config.penalty+'초를 차감할까요?</p><button id="apply">벌점 적용</button>');$('#apply').onclick=()=>{tick();if(ended)return;penalties++;remaining=Math.max(0,remaining-config.penalty*1000);if(running)deadline=Date.now()+remaining;$('#modal').close();if(!remaining){ended=true;running=false;show('시간이 다 됐어요','<p>설정에서 새 게임을 시작할 수 있어요.</p>')}render();notify('벌점 '+config.penalty+'초 적용')}};

reset=function(){mileage=0;redeemed.clear();started=false;musicWanted=false;bgm.pause();bgm.currentTime=0;originalReset();};
$('.play').onclick=()=>{if(!ended&&!running&&!started){started=true;if(!musicWanted)$('.music').click();}toggle();};
$('.hidden').onclick=()=>show('숨겨진 물체','<p>이 테마에는 숨겨진 물체가 없습니다.</p>');
function redeemCode(value){const code=value.trim().toUpperCase();if(!Object.prototype.hasOwnProperty.call(rewards,code))return {ok:false,message:'사용할 수 없는 코드입니다.'};if(redeemed.has(code))return {ok:false,message:'이미 적립한 코드입니다.'};redeemed.add(code);mileage+=rewards[code];return {ok:true,message:rewards[code]+'마일리지가 적립되었습니다.'};}
function updateMileage(){$('#mileage-total').textContent='현재 마일리지는 총 '+mileage+' 입니다.';$('#mileage-goal').textContent=mileage===1500?'1500마일리지 목표를 달성했습니다!':'목표: 1500마일리지';}
$('.code').onclick=()=>{if(ended)return notify('게임이 끝났어요');show('마일리지 적립','<p>획득한 코드를 입력하여 마일리지를 적립하세요.</p><form id="mileage-form"><label>코드<input id="mileage-code" autocomplete="off" autocapitalize="characters" spellcheck="false" required maxlength="40"></label><button>적립하기</button><p id="feedback" role="status"></p></form><p id="mileage-total" class="success"></p><p id="mileage-goal" class="success"></p>');updateMileage();$('#mileage-form').onsubmit=e=>{e.preventDefault();tick();if(ended)return;const result=redeemCode($('#mileage-code').value);$('#feedback').className=result.ok?'success':'error';$('#feedback').textContent=result.message;if(result.ok){$('#mileage-code').value='';notify(result.message+' 현재 마일리지는 총 '+mileage+' 입니다.');}updateMileage();render();if(result.ok&&mileage>=1500)finishMission('clear');};};
$('.penalty').onclick=()=>{if(ended)return notify('게임이 끝났어요');tick();if(ended)return;penalties++;remaining=Math.max(0,remaining-60000);if(running)deadline=Date.now()+remaining;if(!remaining){finishMission('timeout');}render();notify('벌점으로 1분이 차감되었습니다.');};
$('.settings').onclick=()=>{show('게임 설정','<p class="note">새 게임을 시작하면 시간과 마일리지가 초기화됩니다. 벌점은 1분입니다.</p><form id="settings"><label>제한 시간 (분)<input id="minutes" type="number" min="1" max="180" required></label><button>적용하고 새 게임</button></form>');$('#minutes').value=config.minutes;$('#settings').onsubmit=e=>{e.preventDefault();config.minutes=Number($('#minutes').value);reset();$('#modal').close();notify('새 게임이 준비됐어요');};};
hintTexts.splice(0,3,'획득한 코드는 마일리지 적립 버튼에서 입력하세요.','각 코드는 한 번씩 적립할 수 있어요. 입력 순서는 상관없어요.','여섯 코드를 모두 적립하면 총 1500마일리지가 됩니다.');
render();const normalTrack=bgm.getAttribute('src');
let missionShown=false;
function updateMissionMusic(){if(missionShown)$('#mission-music').textContent=bgm.paused?'음악 재생':'음악 일시정지';}
async function playMissionMusic(){try{await bgm.play();updateMissionMusic();}catch(error){if(error.name==='AbortError')return;updateMissionMusic();notify('음악 재생 버튼을 눌러 주세요.');}}
function finishMission(reason){if(missionShown)return;missionShown=true;running=false;ended=true;if(reason==='timeout')remaining=0;musicWanted=false;bgm.pause();bgm.src=$('#mission-track').getAttribute('src');bgm.loop=true;bgm.currentTime=0;if($('#modal').open)$('#modal').close();$('main').hidden=true;$('#mission-screen').hidden=false;$('#mission-summary').textContent=(reason==='clear'?'1500마일리지 목표 달성!':'시간이 종료되었습니다.')+' 현재 마일리지는 총 '+mileage+' 입니다.';render();$('#mission-screen').focus();window.scrollTo(0,0);playMissionMusic();}
bgm.addEventListener('play',updateMissionMusic);bgm.addEventListener('pause',updateMissionMusic);
$('#mission-music').onclick=()=>{if(bgm.paused)playMissionMusic();else bgm.pause();};
const resetBeforeMission=reset;
reset=function(){missionShown=false;bgm.pause();bgm.src=normalTrack;bgm.loop=true;$('#mission-screen').hidden=true;$('main').hidden=false;resetBeforeMission();};
$('#mission-reset').onclick=()=>{reset();$('.play').focus();window.scrollTo(0,0);};let animalSolved=false;
function openNook(){if(ended)return;$('#modal').close();$('main').hidden=true;$('#nook-screen').hidden=false;$('#animal-popup').hidden=animalSolved;$('#nook-reward').hidden=!animalSolved;$('#nook-speech').textContent=animalSolved?'배추흰나비구나! 우리 섬에서 보기 드문 귀한 나비야구리.\n여기 16번 카드를 가져가구리.':'신비한 동물을 발견하면 나에게 꼭 알려줘구리!';$('#animal-answer').value='';$('#animal-feedback').textContent='';$('#nook-screen').focus({preventScroll:true});}
$('.machine').onclick=()=>{if(ended)return;show('기계 장치','<form id="machine-code-form"><label>장치 번호<input id="machine-code" type="text" inputmode="numeric" autocomplete="off" maxlength="8" required></label><button type="submit">장치 작동</button><p id="machine-error" class="error" role="status"></p></form>');$('#machine-code-form').onsubmit=e=>{e.preventDefault();tick();if(ended)return;if($('#machine-code').value==='24')openNook();else $('#machine-error').textContent='장치 번호를 다시 확인해 주세요.';};};
$('#animal-form').onsubmit=e=>{e.preventDefault();tick();if(ended)return;if($('#animal-answer').value!=='배추흰나비'){$('#animal-feedback').textContent='동물 이름을 다시 확인해 주세요.';return;}animalSolved=true;$('#animal-popup').hidden=true;$('#nook-reward').hidden=false;$('#nook-speech').textContent='배추흰나비구나! 우리 섬에서 보기 드문 귀한 나비야구리.\n여기 16번 카드를 가져가구리.';};
$('#nook-back').onclick=()=>{$('#nook-screen').hidden=true;if(!ended){$('main').hidden=false;$('.machine').focus({preventScroll:true});}};
const finishBeforeNook=finishMission;finishMission=function(reason){$('#nook-screen').hidden=true;finishBeforeNook(reason);};
const resetBeforeNook=reset;reset=function(){animalSolved=false;$('#nook-screen').hidden=true;resetBeforeNook();};const penaltySound=$('#penalty-sound');penaltySound.volume=1;
const applyPenaltyWithNoSound=$('.penalty').onclick;
$('.penalty').onclick=()=>{const previous=penalties;applyPenaltyWithNoSound();if(penalties===previous)return;penaltySound.pause();penaltySound.currentTime=0;penaltySound.play().catch(error=>{if(error.name!=='AbortError')notify('1분이 차감되었습니다. 효과음을 재생하지 못했어요.');});};
const resetBeforePenaltySound=reset;reset=function(){penaltySound.pause();penaltySound.currentTime=0;resetBeforePenaltySound();};const campSound=$('#camp-sound');
$('#camp-close').onclick=()=>$('#camp-popup').close();
const openMileageBeforeCamp=$('.code').onclick;
$('.code').onclick=()=>{if(ended)return openMileageBeforeCamp();openMileageBeforeCamp();const form=$('#mileage-form');const submitBeforeCamp=form.onsubmit;form.onsubmit=e=>{const campRequested=$('#mileage-code').value.trim().toUpperCase()==='CAMP';const previouslyRedeemed=redeemed.has('CAMP');submitBeforeCamp(e);if(campRequested&&!previouslyRedeemed&&redeemed.has('CAMP')){$('#camp-mileage').textContent='200마일리지가 적립되었습니다. 현재 마일리지는 총 '+mileage+' 입니다.';$('#camp-popup').showModal();campSound.pause();campSound.currentTime=0;campSound.play().catch(error=>{if(error.name!=='AbortError')notify('조리대가 개방되었습니다. 36번 카드를 가져가세요.');});}};};
const resetBeforeCamp=reset;reset=function(){if($('#camp-popup').open)$('#camp-popup').close();campSound.pause();campSound.currentTime=0;resetBeforeCamp();};</script></body></html>
