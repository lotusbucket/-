<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숲속 탈출 타이머</title><style>
*{box-sizing:border-box}body{margin:0;background:#284e38;color:#482714;font-family:system-ui,'Malgun Gothic',sans-serif}main{position:relative;width:min(100%,720px);margin:auto;aspect-ratio:9/16}main>img{width:100%;display:block}button{cursor:pointer;font:inherit}button:focus-visible{outline:5px solid #fff;box-shadow:0 0 0 8px #286c43}.spot{position:absolute;border:0;background:transparent;border-radius:50%;transition:background .15s,transform .15s}.spot:hover{background:#fff4;transform:scale(1.035)}.spot:active{background:#5224}.music{left:4%;top:1.5%;width:17%;height:9%}.settings{left:42%;top:1.5%;width:16%;height:9%}.exit{left:80%;top:1.5%;width:16%;height:9%}.play{left:37%;top:33%;width:26%;height:14%}.hint{left:14%;top:41%;width:22%;height:13%}.code{left:64%;top:41%;width:22%;height:13%}.hidden{left:8%;top:55%;width:23%;height:13%}.penalty{left:37%;top:52%;width:26%;height:15%}.machine{left:69%;top:55%;width:23%;height:13%}.auto{left:20%;top:68%;width:23%;height:13%}.history{left:49%;top:69%;width:23%;height:14%}#timer{position:absolute;left:25%;top:17.3%;width:50%;height:9.8%;display:grid;place-items:center;background:linear-gradient(110deg,#fbe4ad,#fff0c9,#f8dfab);font-size:clamp(40px,12vw,88px);font-weight:950;letter-spacing:-.04em;font-variant-numeric:tabular-nums;border-radius:8px}#status{position:absolute;left:26%;top:27.5%;width:48%;text-align:center;font-weight:800;font-size:clamp(12px,3vw,18px);background:#ffe9bccc;border-radius:20px;padding:5px}#pause{display:none;font-size:clamp(45px,11vw,85px);color:#42270e;background:#a0d95c;border-radius:25%;line-height:1}.playing #pause{display:inline}dialog{border:5px solid #936335;border-radius:24px;background:#fff0cd;color:#482714;width:min(92vw,460px);padding:25px;box-shadow:0 20px 80px #0006}dialog::backdrop{background:#173422b8;backdrop-filter:blur(4px)}h2{margin:0 0 15px;font-size:24px}p{line-height:1.65}label{display:block;margin:14px 0}input{width:100%;font:inherit;padding:12px;border:2px solid #c9a572;border-radius:10px;background:#fffaf0;color:#482714}dialog button{padding:12px 18px;border:0;border-radius:12px;background:#39794c;color:white;font-weight:750;margin:5px 6px 0 0}.secondary{background:#e6c594!important;color:#482714!important}.error{color:#9c3027;font-weight:700}.note{font-size:14px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2d5535;color:white;border-radius:15px;padding:14px 22px;z-index:10;max-width:90%;text-align:center}#toast:empty{display:none}
main{container-type:inline-size}.play{display:grid;place-items:center}.play::before{content:"";position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 35% 25%,#b1e66a,#92ce4c 68%,#83bf41)}.play::after{content:"";position:relative;width:0;height:0;border-top:4.8cqw solid transparent;border-bottom:4.8cqw solid transparent;border-left:7.5cqw solid #3e2b12;margin-left:1.8cqw}.play.playing::after{width:6.6cqw;height:9cqw;border:0;margin:0;background:linear-gradient(to right,#3e2b12 0 32%,transparent 32% 68%,#3e2b12 68%);border-radius:3px}#pause{display:none!important}.success{color:#286a40;font-weight:700}[hidden]{display:none!important}#mission-screen{position:relative;width:min(100%,720px);aspect-ratio:9/16;margin:auto;overflow:hidden}#mission-screen img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:fill}.mission-actions{position:absolute;bottom:0;left:0;right:0;display:flex;gap:12px;justify-content:center;padding:10px;flex-wrap:wrap}.mission-actions button{padding:12px 20px;border:0;border-radius:12px;background:#ffe6b2;color:#482714;font-weight:700}#mission-summary{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}html,body{min-height:100%;margin:0}body{min-height:100svh;display:grid;place-items:center}main,#mission-screen{width:min(100vw,56.25svh,720px);aspect-ratio:9/16;margin:0 auto}main>img{width:100%;height:100%;position:absolute;inset:0;object-fit:fill}</style></head><body><main aria-label="숲속 탈출 게임"><img src="forest.png" alt="숲속 나무 시계와 게임 버튼"><output id="timer" aria-label="남은 시간">60:00</output><div id="status" role="status">시작 버튼을 눌러 주세요</div>
<button class="spot music" aria-label="소리 켜기" title="소리 켜기"></button><button class="spot settings" aria-label="시간과 게임 설정" title="시간과 게임 설정"></button><button class="spot exit" aria-label="게임 종료" title="게임 종료"></button><button class="spot play" aria-label="시작 / 일시정지" title="시작 / 일시정지"><span id="pause">Ⅱ</span></button><button class="spot hint" aria-label="힌트" title="힌트"></button><button class="spot code" aria-label="마일리지 적립" title="마일리지 적립"></button><button class="spot hidden" aria-label="숨겨진 물체" title="숨겨진 물체"></button><button class="spot penalty" aria-label="벌점" title="벌점"></button><button class="spot machine" aria-label="기계 장치" title="기계 장치"></button><button class="spot auto" aria-label="자동 힌트 켜기" title="자동 힌트 켜기"></button><button class="spot history" aria-label="힌트 다시 보기" title="힌트 다시 보기"></button></main><dialog id="modal"><h2 id="title"></h2><div id="body"></div><button class="secondary" id="close">닫기</button></dialog><div id="toast" role="status"></div>
<audio id="bgm" src="bgm.mp3" preload="none" loop></audio>
<section id="mission-screen" hidden aria-label="미션 완료" tabindex="-1"><img src="mission.jpg" alt="미션 완료 안내와 다음 장소를 찾기 위한 퍼즐"><p id="mission-summary" role="status"></p><div class="mission-actions"><button id="mission-music">음악 일시정지</button><button id="mission-reset">새 게임</button></div></section><audio id="mission-track" src="mission.mp3" preload="none" loop></audio><script>
const $=s=>document.querySelector(s);const defaults={minutes:60,answer:'4312',penalty:60};let config={...defaults},remaining=3600000,deadline=0,running=false,ended=false,sound=false,automatic=false,hints=[],penalties=0,machine=false,elapsed=0,last=0,ctx,toastTimer;
const hintTexts=['쪽지의 기호를 숫자로 바꿔 보세요. 잎 → 사과 → 꽃 → 나비 순서입니다.','기계 장치의 다이얼을 3에 맞추면 기호별 숫자를 알 수 있어요.','잎 4, 사과 3, 꽃 1, 나비 2. 이 순서대로 네 자리 암호를 입력하세요.'];
function beep(freq=660){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.start();o.stop(ctx.currentTime+.3)}catch{}}
function notify(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function show(t,html){$('#title').textContent=t;$('#body').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
$('#close').onclick=()=>$('#modal').close();
function render(){let s=Math.ceil(remaining/1000);$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('.play').classList.toggle('playing',running);$('.play').setAttribute('aria-label',running?'일시정지':'시작');$('#status').textContent=ended?(remaining<=0?'시간 종료 · 다시 도전해 보세요':'탈출 성공!'):(running?'탐험 중':elapsed?'일시정지':'시작 버튼을 눌러 주세요')+' · 벌점 '+penalties+'회';}
function tick(){if(running){let now=Date.now();elapsed+=Math.max(0,now-last);last=now;remaining=Math.max(0,deadline-now);if(!remaining){finishMission('timeout')}else if(automatic&&hints.length<3&&elapsed>=(hints.length+1)*300000)giveHint()}render()}
function toggle(){if(ended){notify('설정에서 새 게임을 시작해 주세요');return}if(running){tick();running=false}else{running=true;last=Date.now();deadline=last+remaining;beep()}render()}
function reset(){running=false;ended=false;remaining=config.minutes*60000;elapsed=0;penalties=0;hints=[];machine=false;render()}
function giveHint(){if(ended)return notify('게임이 끝났어요');if(hints.length===3)return showHistory();const text=hintTexts[hints.length];hints.push(text);show('힌트 '+hints.length,'<p>'+text+'</p><p class="note">힌트는 시간 차감 없이 제공됩니다.</p>')}
function showHistory(){show('힌트 다시 보기',hints.length?hints.map((h,i)=>'<p><b>힌트 '+(i+1)+'</b><br>'+h+'</p>').join(''):'<p>아직 확인한 힌트가 없어요.</p>')}
$('.play').onclick=toggle;$('.hint').onclick=giveHint;$('.history').onclick=showHistory;
const bgm=$('#bgm');let musicWanted=false;bgm.volume=.65;
function updateMusicButton(){const playing=!bgm.paused;$('.music').setAttribute('aria-pressed',String(playing));$('.music').setAttribute('aria-label',playing?'배경음악 일시정지':'배경음악 재생');$('.music').title=playing?'배경음악 일시정지':'배경음악 재생';}
bgm.addEventListener('play',updateMusicButton);bgm.addEventListener('pause',updateMusicButton);
bgm.addEventListener('error',()=>{musicWanted=false;bgm.pause();updateMusicButton();notify('음악을 불러오지 못했어요. 파일을 다시 열어 주세요.');});
$('.music').onclick=async()=>{musicWanted=!musicWanted;if(!musicWanted){bgm.pause();notify('배경음악 일시정지');return;}try{await bgm.play();if(musicWanted)notify('배경음악 재생 중');}catch(error){if(error.name==='AbortError')return;musicWanted=false;updateMusicButton();notify('음악을 재생하지 못했어요. 음표 버튼을 다시 눌러 주세요.');}};
updateMusicButton();
$('.auto').onclick=()=>{automatic=!automatic;$('.auto').setAttribute('aria-pressed',automatic);notify('자동 힌트 '+(automatic?'켜짐 · 플레이 5분마다 제공':'꺼짐'))};
$('.hidden').onclick=()=>show('숲속에서 발견한 쪽지','<p>문을 여는 순서가 적혀 있어요.</p><p style="font-size:24px;text-align:center">잎 → 사과 → 꽃 → 나비</p><p>기계 장치에는 “삼각형의 꼭짓점 수만큼 다이얼을 돌려라”라고 쓰여 있어요.</p>');
$('.machine').onclick=()=>{show('기계 장치',machine?'<p>장치가 열려 있어요!</p><p>잎 = 4 · 사과 = 3 · 꽃 = 1 · 나비 = 2</p>':'<p>“삼각형의 꼭짓점 수만큼 다이얼을 돌려라.”</p><form id="gear"><label>다이얼 (0–9)<input id="dial" type="number" min="0" max="9" value="0" required></label><button>장치 작동</button><p id="feedback" class="error" role="status"></p></form>');if($('#gear'))$('#gear').onsubmit=e=>{e.preventDefault();if($('#dial').value==='3'){machine=true;beep();$('.machine').click()}else $('#feedback').textContent='장치가 움직이지 않아요. 숫자를 다시 생각해 보세요.'}};
$('.code').onclick=()=>{if(ended)return notify('게임이 끝났어요');show('암호 입력','<p>숲의 출구를 여는 암호를 입력하세요.</p><form id="unlock"><label>암호<input id="answer" autocomplete="off" required maxlength="40"></label><button>문 열기</button><p id="feedback" role="status" class="error"></p></form>');$('#unlock').onsubmit=e=>{e.preventDefault();tick();if(ended)return;if($('#answer').value.trim()===config.answer){running=false;ended=true;beep(880);render();show('탈출 성공!','<p>숲의 문이 열렸어요. 축하합니다!</p><p>남은 시간 <b>'+$('#timer').textContent+'</b> · 벌점 '+penalties+'회</p><button id="again">다시 플레이</button>');$('#again').onclick=()=>{reset();$('#modal').close()}}else{$('#feedback').textContent='암호가 달라요. 쪽지와 기계 장치를 확인해 주세요.';beep(220)}}};
$('.penalty').onclick=()=>{if(ended)return notify('게임이 끝났어요');show('벌점 적용','<p>남은 시간에서 '+config.penalty+'초를 차감할까요?</p><button id="apply">벌점 적용</button>');$('#apply').onclick=()=>{tick();if(ended)return;penalties++;remaining=Math.max(0,remaining-config.penalty*1000);if(running)deadline=Date.now()+remaining;$('#modal').close();if(!remaining){ended=true;running=false;show('시간이 다 됐어요','<p>설정에서 새 게임을 시작할 수 있어요.</p>')}render();notify('벌점 '+config.penalty+'초 적용')}};
$('.settings').onclick=()=>{show('게임 설정','<p class="note">적용하면 진행 상황이 초기화됩니다. 기본 암호 4312는 예제 퍼즐의 정답입니다.</p><form id="settings"><label>제한 시간 (분)<input id="minutes" type="number" min="1" max="180" required></label><label>정답 암호<input id="secret" required maxlength="40"></label><label>벌점 (초)<input id="seconds" type="number" min="0" max="3600" required></label><button>적용하고 새 게임</button></form>');$('#minutes').value=config.minutes;$('#secret').value=config.answer;$('#seconds').value=config.penalty;$('#settings').onsubmit=e=>{e.preventDefault();if(!$('#secret').value.trim())return;config={minutes:Number($('#minutes').value),answer:$('#secret').value.trim(),penalty:Number($('#seconds').value)};reset();$('#modal').close();notify('새 게임이 준비됐어요')}};
$('.exit').onclick=()=>{show('게임 종료','<p>진행 중인 게임을 초기화하고 시작 화면으로 돌아갈까요?</p><button id="quit">게임 종료</button>');$('#quit').onclick=()=>{reset();$('#modal').close()}};
setInterval(tick,200);render();
// Theme controls and mileage rules.
const rewards={BUG:300,FRIEND:300,FISH:300,FIRE:200,PEAR:200,CAMP:200};
let mileage=0,redeemed=new Set(),started=false;
const originalRender=render;
render=function(){originalRender();$('.play').title=running?'일시정지':'시작';$('#status').textContent=(ended?'시간 종료':running?'탐험 중':started?'일시정지':'시작 버튼을 눌러 주세요')+' · '+mileage+'/1500 마일리지';};
const originalReset=reset;
reset=function(){mileage=0;redeemed.clear();started=false;musicWanted=false;bgm.pause();bgm.currentTime=0;originalReset();};
$('.play').onclick=()=>{if(!ended&&!running&&!started){started=true;if(!musicWanted)$('.music').click();}toggle();};
$('.hidden').onclick=()=>show('숨겨진 물체','<p>이 테마에는 숨겨진 물체가 없습니다.</p>');
function redeemCode(value){const code=value.trim().toUpperCase();if(!Object.prototype.hasOwnProperty.call(rewards,code))return {ok:false,message:'사용할 수 없는 코드입니다.'};if(redeemed.has(code))return {ok:false,message:'이미 적립한 코드입니다.'};redeemed.add(code);mileage+=rewards[code];return {ok:true,message:rewards[code]+'마일리지가 적립되었습니다.'};}
function updateMileage(){$('#mileage-total').textContent='현재 마일리지는 총 '+mileage+' 입니다.';$('#mileage-goal').textContent=mileage===1500?'1500마일리지 목표를 달성했습니다!':'목표: 1500마일리지';}
$('.code').onclick=()=>{if(ended)return notify('게임이 끝났어요');show('마일리지 적립','<p>획득한 코드를 입력하여 마일리지를 적립하세요.</p><form id="mileage-form"><label>코드<input id="mileage-code" autocomplete="off" autocapitalize="characters" spellcheck="false" required maxlength="40"></label><button>적립하기</button><p id="feedback" role="status"></p></form><p id="mileage-total" class="success"></p><p id="mileage-goal" class="success"></p>');updateMileage();$('#mileage-form').onsubmit=e=>{e.preventDefault();tick();if(ended)return;const result=redeemCode($('#mileage-code').value);$('#feedback').className=result.ok?'success':'error';$('#feedback').textContent=result.message;if(result.ok){$('#mileage-code').value='';notify(result.message+' 현재 마일리지는 총 '+mileage+' 입니다.');}updateMileage();render();if(result.ok&&mileage>=1500)finishMission('clear');};};
$('.penalty').onclick=()=>{if(ended)return notify('게임이 끝났어요');tick();if(ended)return;penalties++;remaining=Math.max(0,remaining-60000);if(running)deadline=Date.now()+remaining;if(!remaining){finishMission('timeout');}render();notify('벌점으로 1분이 차감되었습니다.');};
$('.settings').onclick=()=>{show('게임 설정','<p class="note">새 게임을 시작하면 시간과 마일리지가 초기화됩니다. 벌점은 1분입니다.</p><form id="settings"><label>제한 시간 (분)<input id="minutes" type="number" min="1" max="180" required></label><button>적용하고 새 게임</button></form>');$('#minutes').value=config.minutes;$('#settings').onsubmit=e=>{e.preventDefault();config.minutes=Number($('#minutes').value);reset();$('#modal').close();notify('새 게임이 준비됐어요');};};
hintTexts.splice(0,3,'획득한 코드는 마일리지 적립 버튼에서 입력하세요.','각 코드는 한 번씩 적립할 수 있어요. 입력 순서는 상관없어요.','여섯 코드를 모두 적립하면 총 1500마일리지가 됩니다.');
render();const normalTrack=bgm.getAttribute('src');
let missionShown=false;
function updateMissionMusic(){if(missionShown)$('#mission-music').textContent=bgm.paused?'음악 재생':'음악 일시정지';}
async function playMissionMusic(){try{await bgm.play();updateMissionMusic();}catch(error){if(error.name==='AbortError')return;updateMissionMusic();notify('음악 재생 버튼을 눌러 주세요.');}}
function finishMission(reason){if(missionShown)return;missionShown=true;running=false;ended=true;if(reason==='timeout')remaining=0;musicWanted=false;bgm.pause();bgm.src=$('#mission-track').getAttribute('src');bgm.loop=true;bgm.currentTime=0;if($('#modal').open)$('#modal').close();$('main').hidden=true;$('#mission-screen').hidden=false;$('#mission-summary').textContent=(reason==='clear'?'1500마일리지 목표 달성!':'시간이 종료되었습니다.')+' 현재 마일리지는 총 '+mileage+' 입니다.';render();$('#mission-screen').focus();window.scrollTo(0,0);playMissionMusic();}
bgm.addEventListener('play',updateMissionMusic);bgm.addEventListener('pause',updateMissionMusic);
$('#mission-music').onclick=()=>{if(bgm.paused)playMissionMusic();else bgm.pause();};
const resetBeforeMission=reset;
reset=function(){missionShown=false;bgm.pause();bgm.src=normalTrack;bgm.loop=true;$('#mission-screen').hidden=true;$('main').hidden=false;resetBeforeMission();};
$('#mission-reset').onclick=()=>{reset();$('.play').focus();window.scrollTo(0,0);};</script></body></html>
