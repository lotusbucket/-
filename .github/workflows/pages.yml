name: Publish forest game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare game
        run: |
          mkdir -p public
          cp index.html forest.png mission.jpg mission.mp3 public/
          cat bgm.part0 bgm.part1 bgm.part2 bgm.part3 > public/bgm.mp3
          test "$(wc -c < public/bgm.mp3)" -eq 75164278
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
