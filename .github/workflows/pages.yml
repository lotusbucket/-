name: Publish forest game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare game
        run: |
          mkdir -p public
          cp index.html forest.png mission.jpg mission.mp3 nook.png public/
          cat bgm.part?? > public/bgm.mp3
          test "$(wc -c < public/bgm.mp3)" -eq 75164278
          echo "2748c09de83c6b0d0b544f5b7f8786a02ac391b58f4f7ef4538e168f6ab04790  public/bgm.mp3" | sha256sum -c -
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
